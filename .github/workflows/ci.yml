name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight test dependencies
        run: python -m pip install numpy Pillow gymnasium pytest ruff
      - name: Compile Python sources
        run: python -m compileall -q -x '(^|/)\.venv(/|$)' .
      - name: Unit tests
        run: python -m pytest -q
      - name: Lint high-confidence errors
        run: ruff check --select E9,F63,F7,F82 .
